openapi: 3.1.0

info:
  title: GamerMarkt API
  version: 1.0.0
  description: |
    REST API for the GamerMarkt gaming marketplace platform.

    ## Authentication

    Every request must be authenticated with a **64-character hex API key**
    via the `X-Api-Key` header:

    ```
    X-Api-Key: <api_key>
    ```

    ### Obtaining an API Key

    1. Log in to your GamerMarkt account.
    2. Navigate to **Dashboard → API Access** (`/api-access`).
    3. Complete email verification and click **Generate API Key**.
    4. Copy the key immediately — it will be partially masked afterwards.

    > **Note:** Only one key exists per account. You can regenerate it at any time
    > (the old key becomes invalid immediately) or toggle it active/inactive.
    > A minimum purchase history may be required before key generation is unlocked.

    ## Currencies

    Your account currency is determined by your registered country:
    - **Turkish accounts** → `TRY`
    - **All other accounts** → `EUR`

    All monetary values in responses are returned as **strings** with exactly
    two decimal places (e.g. `"50.00"`), using `.` as the decimal separator
    and no thousands separator.

    ## Pagination

    Paginated endpoints accept `page` (1–1,000,000) and `per_page` query parameters and
    return a `meta` object. A value that is not a whole number or is out of range is
    refused with `422 VALIDATION_ERROR`, never silently replaced:

    ```json
    {
      "meta": {
        "total": 250,
        "page": 2,
        "per_page": 20,
        "last_page": 13
      }
    }
    ```

    ## Error Format

    All errors follow a consistent envelope:

    ```json
    {
      "success": false,
      "error": "Human-readable message.",
      "code": "ERROR_CODE"
    }
    ```

    See individual endpoints for the specific error codes they can return. Every answer is
    JSON in this envelope, also for an unknown path (`404 NOT_FOUND`), an unexpected failure
    (`500 INTERNAL_ERROR`) and maintenance (`503 SERVICE_UNAVAILABLE`, with a `Retry-After`
    header).

    ## Rate Limiting

    > **All endpoints share a single limit of 15 requests per minute.**
    >
    > The limit is enforced in front of the API, not by the API itself: once it is exceeded the
    > request is answered with a verification page (HTML, not JSON) and a client that keeps sending
    > can be blocked for an extended period. Design your integration accordingly — cache responses
    > where possible and avoid polling at high frequency.

servers:
  - url: https://www.gamermarkt.com/api/v1
    description: Production

security:
  - ApiKeyHeader: []

tags:
  - name: Account
    description: Authenticated user account information
  - name: Products
    description: Browse available products
  - name: Coupons
    description: The account's coupons, as shown on the My Coupons page
  - name: Orders
    description: Create and inspect orders

paths:
  /account:
    get:
      operationId: getAccount
      summary: Get account balance
      description: |
        Returns the authenticated user's available and blocked balance
        in their account currency (TRY or EUR).
      tags: [Account]
      responses:
        "200":
          description: Account balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              example:
                success: true
                data:
                  balance: "150.00"
                  blocked_balance: "10.00"
                  currency: "TRY"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /products:
    get:
      operationId: listProducts
      summary: List products
      description: |
        Returns active, purchasable products.

        **Default behaviour (no `per_page`):** all matching products are returned in a single
        response — no `meta` object is included.

        **Paginated mode:** pass `per_page` (and optionally `page`) to receive a subset of
        results along with a `meta` pagination object.

        - Standard products are returned by default; pass `list_topups=1` to include top-up products as well.
        - Only products that are on sale are returned (their category is active and not a draft). Products whose codes are valid for Turkey's stores only (Steam wallet, Apple iTunes and Google Play codes) are left out for accounts outside Turkey.
        - `name`, `category_name` and the top-up `label`s are plain text.
        - Top-up products include a `topup_inputs` array describing the fields the buyer must fill in when ordering (e.g. game user ID, server).
        - `name` and `category_name` language is controlled by the `lang` parameter (`tr`/`en`); defaults to the authenticated user's account language.
        - `price` is always in the authenticated user's currency.
        - `stock` is exact below 50 units; from 50 up it is rounded down to `50` (50–100 units), `100` (101–200) or `200` (more than 200). `0` means out of stock.
      tags: [Products]
      parameters:
        - name: lang
          in: query
          description: |
            Language for `name` and `category_name` fields.
            Accepts `tr` or `en`. When omitted, the authenticated user's account language
            is used: `tr` when it is Turkish, otherwise `en`.
          schema:
            type: string
            enum: [tr, en]
          example: en
        - name: per_page
          in: query
          description: |
            Items per page. **When omitted, all products are returned without pagination.**
            Whole number between 1 and 100; anything else is a `422`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: page
          in: query
          description: Page number (1-based). Only used when `per_page` is also provided.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: category_id
          in: query
          description: Filter by category ID. Omit to return all categories.
          schema:
            type: integer
          example: 5
        - name: list_topups
          in: query
          description: |
            When set to `1`, top-up products are included alongside standard
            products. When omitted or `0`, only standard products are returned.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          example: 1
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              examples:
                all_products:
                  summary: All products (no pagination)
                  value:
                    success: true
                    data:
                      - ref: "steam-50-try"
                        name: "Steam 50 TRY"
                        category_id: 5
                        category_name: "Steam"
                        is_topup: false
                        price: "50.00"
                        currency: "TRY"
                        stock: 120
                        topup_inputs: null
                      - ref: "steam-100-try"
                        name: "Steam 100 TRY"
                        category_id: 5
                        category_name: "Steam"
                        is_topup: false
                        price: "100.00"
                        currency: "TRY"
                        stock: 45
                        topup_inputs: null
                topup_product:
                  summary: Top-up product with input definitions
                  value:
                    success: true
                    data:
                      - ref: "valorant-vp-1050"
                        name: "1050 VP"
                        category_id: 12
                        category_name: "Valorant"
                        is_topup: true
                        price: "250.00"
                        currency: "TRY"
                        stock: 50
                        topup_inputs:
                          - key: "riot_id"
                            type: "TEXT"
                            label: "Riot ID"
                            placeholder: "Örn: Player#TR1"
                            sort: 0
                            max: 255
                paginated:
                  summary: Paginated (per_page provided)
                  value:
                    success: true
                    data:
                      - ref: "steam-50-try"
                        name: "Steam 50 TRY"
                        category_id: 5
                        category_name: "Steam"
                        is_topup: false
                        price: "50.00"
                        currency: "TRY"
                        stock: 120
                        topup_inputs: null
                    meta:
                      total: 200
                      page: 1
                      per_page: 20
                      last_page: 10
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          description: A query value that is not a whole number or is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                success: false
                error: "per_page must be a whole number between 1 and 50."
                code: "VALIDATION_ERROR"

  /coupons:
    get:
      operationId: listCoupons
      summary: List coupons
      description: |
        Returns a paginated list of the authenticated user's coupons, newest first: the same list, states and
        figures as the **My Coupons** page. Deleted coupons are not listed.

        An `active` coupon is applied to an order automatically when it fits the ordered products
        (see `POST /orders`); its `code` can also be sent as `coupon_code` to pick it. A coupon comes
        back to `active` when the order that used it is cancelled and refunded.
      tags: [Coupons]
      parameters:
        - name: status
          in: query
          description: |
            Filter by state: `active` (usable now), `used`, `cancelled`, `expired`, `invalid` (cancelled, expired
            or run out) or `all`. `meta.counts` holds the number of coupons in each.
          schema:
            type: string
            enum: [all, active, used, cancelled, expired, invalid]
            default: all
        - name: lang
          in: query
          description: Language of `name` and `categories` (defaults to the account language); both are plain text
          schema:
            type: string
            enum: [tr, en]
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Coupon list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponListResponse"
              example:
                success: true
                data:
                  - id: 812
                    code: "K7Q2XPA"
                    name: "Special for You"
                    status: "active"
                    categories: ["Steam"]
                    discount_percentage: "10.00"
                    max_discount_amount: "25.00"
                    min_shopping_amount: "100.00"
                    currency: "TRY"
                    usage_count: 0
                    max_usage_count: null
                    total_discount: "0.00"
                    expires_at: "2026-11-30T23:59:59+03:00"
                    used_at: null
                    order_id: null
                meta:
                  total: 1
                  page: 1
                  per_page: 20
                  last_page: 1
                  counts:
                    all: 4
                    active: 1
                    used: 1
                    cancelled: 1
                    expired: 1
                    invalid: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          description: Invalid `status`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                success: false
                error: "status must be one of: all, active, used, invalid."
                code: "VALIDATION_ERROR"

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: |
        Returns a paginated list of the authenticated user's product orders (placed through the API or
        the website basket), sorted newest first. Other order types, such as listing purchases and
        advertising, are not included.
      tags: [Orders]
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
              example:
                success: true
                data:
                  - id: 123
                    amount: "100.00"
                    currency: "TRY"
                    discount: "0.00"
                    status: "completed"
                    payment: "paid"
                    created_at: "2024-06-15T10:30:00+03:00"
                    completed_at: "2024-06-15T10:30:05+03:00"
                    cancelled_at: null
                  - id: 122
                    amount: "50.00"
                    currency: "TRY"
                    discount: "5.00"
                    status: "cancelled"
                    payment: "refunded"
                    created_at: "2024-06-14T09:12:00+03:00"
                    completed_at: null
                    cancelled_at: "2024-06-14T09:15:00+03:00"
                meta:
                  total: 2
                  page: 1
                  per_page: 20
                  last_page: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          description: A query value that is not a whole number or is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                success: false
                error: "per_page must be a whole number between 1 and 50."
                code: "VALIDATION_ERROR"

    post:
      operationId: createOrder
      summary: Create order
      description: |
        Places a new order using the authenticated user's account balance.

        ### Rules
        - Each product is identified by its `ref` string (from the `/products` endpoint).
        - `amount` must be between **1 and 49** per line item.
        - Maximum **20 distinct products** per request.
        - **Duplicate refs** in the same request are rejected — combine quantities into a single entry instead.
        - **Top-up products** (`is_topup: true`) must have `amount: 1` and require a `topup_inputs` object containing all fields defined in the product's `topup_inputs` array.
        - `amount` is a whole number (a JSON number or digits in a string); `1.5`, `true` or `"2 pcs"` are refused.
        - **Coupons:** send a coupon's `code` (from `GET /coupons`) as `coupon_code` to use that coupon. Without
          `coupon_code`, the active coupon with the largest discount for the ordered products (the one that
          expires first among equals) is applied automatically, exactly as the basket does. Send
          `use_coupon: false` to order without any coupon (it cannot be combined with `coupon_code`). The applied
          coupon is returned as `coupon_code`.
        - A `ref` that is not on sale (its category is inactive or a draft) is `NOT_FOUND`. Steam, Apple iTunes and
          Google Play codes are not sold to accounts outside Turkey.
        - The order, its payment and the coupon use happen together: a failed order leaves nothing behind, no charge,
          no spent coupon and no cancelled order. Orders sent at the same time from one account are all paid.
        - The full order amount, less the coupon discount, is deducted from the user's balance atomically.
        - Orders are processed automatically; digital goods are delivered to the account.

        ### Errors

        `code` is the stable part of an error; `error` is a human-readable message that may be reworded.
        `ORDER_FAILED` messages follow the `lang` parameter (`tr` or `en`; default: the account language), all other
        messages are always English. The messages below are the English ones.

        | Condition | HTTP | `code` | `error` |
        |-----------|------|--------|---------|
        | Body larger than 64 KB | 413 | `PAYLOAD_TOO_LARGE` | `Request body too large.` |
        | Body is not a JSON object | 422 | `VALIDATION_ERROR` | `Request body must be a JSON object.` |
        | `products` missing, empty or not a list | 422 | `VALIDATION_ERROR` | `products array is required.` |
        | More than 20 products | 422 | `VALIDATION_ERROR` | `Maximum 20 products per order.` |
        | An entry without a `ref` | 422 | `VALIDATION_ERROR` | `Each product must have a ref.` |
        | The same `ref` twice | 422 | `VALIDATION_ERROR` | `Duplicate product refs are not allowed. Combine amounts into a single entry per ref.` |
        | `ref` missing or `amount` outside 1–49 | 422 | `VALIDATION_ERROR` | `Invalid product entry: ref required, amount must be 1-49.` |
        | `ref` unknown or inactive | 422 | `NOT_FOUND` | `Product not found: {ref}` |
        | Top-up product without `topup_inputs` | 422 | `VALIDATION_ERROR` | `topup_inputs is required for top-up product: {ref}` |
        | A `topup_inputs` value that is not a string or number | 422 | `VALIDATION_ERROR` | `topup_inputs values must be strings or numbers: {ref}` |
        | `use_coupon` is not true or false | 422 | `VALIDATION_ERROR` | `use_coupon must be true or false.` |
        | `use_coupon: false` together with `coupon_code` | 422 | `VALIDATION_ERROR` | `coupon_code cannot be combined with use_coupon: false.` |
        | `coupon_code` empty or not a string | 422 | `VALIDATION_ERROR` | `coupon_code must be a non-empty string.` |
        | `coupon_code` is not one of your coupons | 422 | `NOT_FOUND` | `Coupon not found: {code}` |
        | Account has no purchase permission | 422 | `ORDER_FAILED` | `You do not have permission to make purchases.` |
        | Top-up product with `amount` above 1 | 422 | `ORDER_FAILED` | `Only 1 unit of each top-up product can be ordered at a time.` |
        | Top-up input missing | 422 | `ORDER_FAILED` | `Missing required field: '{key}'.` |
        | Top-up TEXT input too short or too long (255 characters when the product sets no maximum) | 422 | `ORDER_FAILED` | `Field '{key}' is shorter than minimum length.` / `Field '{key}' exceeds maximum length.` |
        | Top-up NUMBER input not a number, below or above its limits | 422 | `ORDER_FAILED` | `Field '{key}' must be a number.` / `Field '{key}' is below minimum value.` / `Field '{key}' exceeds maximum value.` |
        | Top-up SELECT input not one of the options | 422 | `ORDER_FAILED` | `Invalid option for field '{key}'.` |
        | Input the product does not define | 422 | `ORDER_FAILED` | `Unknown field: '{key}'.` |
        | Steam, Apple iTunes or Google Play code, account outside Turkey | 422 | `ORDER_FAILED` | `{name} is only sold to accounts in Turkey.` |
        | Insufficient stock | 422 | `ORDER_FAILED` | `Not enough stock for {name}. Available: {n}` |
        | Turkish account whose phone number is not verified (orders in TRY need a verified phone) | 422 | `ORDER_FAILED` | `Currency mismatch.` |
        | Insufficient balance | 422 | `ORDER_FAILED` | `Insufficient balance.` (with `redirect`, `balance_needed` and `currency`) |
        | Order could not be saved or paid | 422 | `ORDER_FAILED` | `Order could not be created.` / `Payment failed.` |
        | Unexpected failure | 500 | `INTERNAL_ERROR` | `Internal server error.` |

        When the chosen `coupon_code` cannot be used, the order is not placed and `error` says why (`ORDER_FAILED`):

        | Reason | `error` |
        |--------|---------|
        | Already used | `This coupon has already been used.` |
        | Expired | `This coupon has expired.` |
        | Cancelled | `This coupon has been cancelled.` |
        | Not usable for another reason | `This coupon can no longer be used.` |
        | Not valid for the ordered products | `This coupon does not apply to the products in your order. It is valid for: {categories}.` |
        | Coupon is in another currency | `This coupon is only valid for orders in {currency}.` |
        | Ordered products below its minimum | `To use this coupon, the products it covers must total at least {amount}.` |
        | Any other case | `This coupon cannot be applied to this order.` |
      tags: [Orders]
      parameters:
        - name: lang
          in: query
          description: |
            Language of the `ORDER_FAILED` messages and of the product names stored on the order.
            Accepts `tr` or `en`. When omitted, the account language is used: `tr` when it is Turkish, otherwise `en`.
          schema:
            type: string
            enum: [tr, en]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              single_product:
                summary: Single product
                value:
                  products:
                    - ref: "steam-50-try"
                      amount: 1
              multiple_products:
                summary: Multiple products
                value:
                  products:
                    - ref: "steam-50-try"
                      amount: 2
                    - ref: "pubg-mobile-60uc"
                      amount: 5
              with_coupon:
                summary: Order with a chosen coupon
                value:
                  products:
                    - ref: "steam-50-try"
                      amount: 2
                  coupon_code: "K7Q2XPA"
              without_coupon:
                summary: Order without the automatic coupon
                value:
                  products:
                    - ref: "steam-50-try"
                      amount: 2
                  use_coupon: false
              topup_product:
                summary: Top-up product with required inputs
                value:
                  products:
                    - ref: "valorant-vp-1050"
                      amount: 1
                      topup_inputs:
                        riot_id: "Player#TR1"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              example:
                success: true
                data:
                  order_id: 456
                  amount: "90.00"
                  discount: "10.00"
                  coupon_code: "K7Q2XPA"
                  currency: "TRY"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Request body larger than 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "Request body too large."
                code: "PAYLOAD_TOO_LARGE"
        "422":
          description: Validation error or order failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/OrderFailedError"
                  - $ref: "#/components/schemas/InsufficientBalanceError"
              examples:
                validation_error:
                  summary: Missing or invalid request body
                  value:
                    success: false
                    error: "products array is required."
                    code: "VALIDATION_ERROR"
                duplicate_ref:
                  summary: Duplicate product ref
                  value:
                    success: false
                    error: "Duplicate product refs are not allowed. Combine amounts into a single entry per ref."
                    code: "VALIDATION_ERROR"
                invalid_amount:
                  summary: Amount out of range
                  value:
                    success: false
                    error: "Invalid product entry: ref required, amount must be 1-49."
                    code: "VALIDATION_ERROR"
                product_not_found:
                  summary: Product ref not found
                  value:
                    success: false
                    error: "Product not found: steam-999-try"
                    code: "NOT_FOUND"
                coupon_not_found:
                  summary: coupon_code is not one of the account's coupons
                  value:
                    success: false
                    error: "Coupon not found: K7Q2XPA"
                    code: "NOT_FOUND"
                coupon_not_applicable:
                  summary: The chosen coupon cannot be used
                  value:
                    success: false
                    error: "This coupon has expired."
                    code: "ORDER_FAILED"
                out_of_stock:
                  summary: Insufficient stock
                  value:
                    success: false
                    error: "Not enough stock for Steam 50 TRY. Available: 0"
                    code: "ORDER_FAILED"
                insufficient_balance:
                  summary: Insufficient balance (with redirect)
                  value:
                    success: false
                    error: "Insufficient balance."
                    code: "ORDER_FAILED"
                    redirect: "https://www.gamermarkt.com/bakiye-yukle"
                    balance_needed: 50
                    currency: "try"

  /order/{id}:
    get:
      operationId: getOrder
      summary: Get order details
      description: |
        Returns full details for a single order, including its products and
        any delivered digital goods.

        ### Delivery format

        The `deliveries` array contains the digital goods delivered for this
        order. The shape of each entry depends on the product type:

        **Account products** (e.g. game accounts, subscriptions):
        ```json
        {
          "product_ref": "netflix-1m-tr",
          "username": "user@example.com",
          "password": "secret123"
        }
        ```

        **E-pin / Code products** (e.g. Steam cards, gift codes):
        ```json
        {
          "product_ref": "steam-50-try",
          "code": "ABCD-EFGH-IJKL-MNOP"
        }
        ```

        **Top-up products** expose the stored top-up input snapshot:
        ```json
        {
          "product_ref": "valorant-vp-tr-375",
          "topup_values": {
            "player_id": "12345678",
            "region": "tr"
          }
        }
        ```

        `deliveries` is empty while the order is still `processing`. Top-up entries are the exception: they
        echo the inputs the order was placed with, so they are present from the start; `products[].delivered`
        tells whether the top-up has been loaded. Delivery entries are generated from the same order snapshot
        used by the order details page.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            minimum: 1
          example: 123
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailResponse"
              examples:
                completed_account:
                  summary: Completed order with account deliveries
                  value:
                    success: true
                    data:
                      id: 123
                      amount: "100.00"
                      currency: "TRY"
                      discount: "0.00"
                      status: "completed"
                      payment: "paid"
                      created_at: "2024-06-15T10:30:00+03:00"
                      completed_at: "2024-06-15T10:30:05+03:00"
                      cancelled_at: null
                      cancellation_reason: null
                      products:
                        - product_ref: "steam-50-try"
                          name: "Steam 50 TRY"
                          amount: 2
                          delivered: 2
                          price: "50.00"
                          total_price: "100.00"
                      deliveries:
                        - product_ref: "steam-50-try"
                          username: "acc1@example.com"
                          password: "pass1"
                        - product_ref: "steam-50-try"
                          username: "acc2@example.com"
                          password: "pass2"
                completed_epin:
                  summary: Completed order with e-pin deliveries
                  value:
                    success: true
                    data:
                      id: 124
                      amount: "50.00"
                      currency: "TRY"
                      discount: "0.00"
                      status: "completed"
                      payment: "paid"
                      created_at: "2024-06-16T11:00:00+03:00"
                      completed_at: "2024-06-16T11:00:03+03:00"
                      cancelled_at: null
                      cancellation_reason: null
                      products:
                        - product_ref: "steam-gift-50-try"
                          name: "Steam Gift Card 50 TRY"
                          amount: 1
                          delivered: 1
                          price: "50.00"
                          total_price: "50.00"
                      deliveries:
                        - product_ref: "steam-gift-50-try"
                          code: "ABCD-EFGH-IJKL-MNOP"
                completed_topup:
                  summary: Completed order with top-up snapshot
                  value:
                    success: true
                    data:
                      id: 126
                      amount: "12.00"
                      currency: "TRY"
                      discount: "0.00"
                      status: "completed"
                      payment: "paid"
                      created_at: "2024-06-18T12:00:00+03:00"
                      completed_at: "2024-06-18T12:00:02+03:00"
                      cancelled_at: null
                      cancellation_reason: null
                      products:
                        - product_ref: "valorant-vp-tr-375"
                          name: "Valorant 375 VP"
                          amount: 1
                          delivered: 1
                          price: "12.00"
                          total_price: "12.00"
                      deliveries:
                        - product_ref: "valorant-vp-tr-375"
                          topup_values:
                            player_id: "12345678"
                            region: "tr"
                processing:
                  summary: Order still processing
                  value:
                    success: true
                    data:
                      id: 125
                      amount: "30.00"
                      currency: "EUR"
                      discount: "0.00"
                      status: "processing"
                      payment: "paid"
                      created_at: "2024-06-17T08:00:00+00:00"
                      completed_at: null
                      cancelled_at: null
                      cancellation_reason: null
                      products:
                        - product_ref: "league-rp-1380"
                          name: "1380 Riot Points"
                          amount: 1
                          delivered: 0
                          price: "30.00"
                          total_price: "30.00"
                      deliveries: []
                cancelled:
                  summary: Cancelled order
                  value:
                    success: true
                    data:
                      id: 121
                      amount: "50.00"
                      currency: "TRY"
                      discount: "0.00"
                      status: "cancelled"
                      payment: "refunded"
                      created_at: "2024-06-13T07:00:00+03:00"
                      completed_at: null
                      cancelled_at: "2024-06-13T07:05:00+03:00"
                      cancellation_reason: "Product became unavailable."
                      products:
                        - product_ref: "some-product"
                          name: "Some Product"
                          amount: 1
                          delivered: 0
                          price: "50.00"
                          total_price: "50.00"
                      deliveries: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Pass the API key in the `X-Api-Key` header.
        ```
        X-Api-Key: <64-char-hex-key>
        ```

  schemas:
    # ── Shared ─────────────────────────────────────────────────────────────

    PaginationMeta:
      type: object
      required: [total, page, per_page, last_page]
      properties:
        total:
          type: integer
          description: Total number of items across all pages
          examples: [250]
        page:
          type: integer
          description: Current page number
          examples: [1]
        per_page:
          type: integer
          description: Items returned per page
          examples: [20]
        last_page:
          type: integer
          description: Index of the last available page
          examples: [13]

    OrderStatus:
      type: string
      enum: [processing, completed, cancelled, unknown]
      description: |
        Current fulfilment status of an order.
        - `processing` — payment received, awaiting delivery
        - `completed` — all items delivered
        - `cancelled` — order cancelled (balance refunded)
        - `unknown` — unexpected internal state

    PaymentStatus:
      type: string
      enum: [pending, paid, refunded, unknown]
      description: |
        Payment state of an order.
        - `pending` — payment not yet collected
        - `paid` — balance successfully deducted
        - `refunded` — balance returned to account
        - `unknown` — unexpected internal state

    # ── Account ────────────────────────────────────────────────────────────

    AccountData:
      type: object
      required: [balance, blocked_balance, currency]
      properties:
        balance:
          type: string
          description: Available balance (2 decimal places, no thousands separator)
          examples: ["150.00"]
        blocked_balance:
          type: string
          description: |
            Balance on hold by GamerMarkt — not spendable until it is released.
          examples: ["10.00"]
        currency:
          type: string
          enum: [TRY, EUR]
          description: Account currency determined by registered country
          examples: ["TRY"]

    AccountResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          $ref: "#/components/schemas/AccountData"

    # ── Products ───────────────────────────────────────────────────────────

    Product:
      type: object
      required: [ref, name, is_topup, price, currency, stock]
      properties:
        ref:
          type: string
          description: |
            Unique product reference string. Use this value in the
            `POST /orders` request body.
          examples: ["steam-50-try"]
        name:
          type: string
          description: Product name in the resolved language (`lang` param, or user account language)
          examples: ["Steam 50 TRY"]
        category_id:
          type: [integer, "null"]
          description: Category ID, or null if uncategorised
          examples: [5]
        category_name:
          type: [string, "null"]
          description: Category name in the resolved language, or null if uncategorised
          examples: ["Steam"]
        is_topup:
          type: boolean
          description: |
            `true` for top-up products that require user inputs (e.g. game user ID)
            before fulfilment. When ordering a top-up product, you must provide
            `topup_inputs` in the order request.
          examples: [false]
        topup_inputs:
          type: ["array", "null"]
          description: |
            Input definitions for top-up products. `null` for standard products.
            Each entry describes one required field the buyer must fill in when ordering.
          items:
            $ref: "#/components/schemas/TopupInputDefinition"
        price:
          type: string
          description: Unit price in the user's currency (2 decimal places)
          examples: ["50.00"]
        currency:
          type: string
          enum: [TRY, EUR]
          description: Price currency
          examples: ["TRY"]
        stock:
          type: integer
          minimum: 0
          description: Units available right now; `0` means out of stock
          examples: [120]

    TopupInputDefinition:
      type: object
      required: [key, type, label]
      properties:
        key:
          type: string
          description: Input field identifier — use as the key in `topup_inputs` when ordering
          examples: ["user_id"]
        type:
          type: string
          enum: [TEXT, NUMBER, SELECT]
          description: Input field type
          examples: ["TEXT"]
        label:
          type: string
          description: Human-readable label (localised per the `lang` parameter)
          examples: ["User ID"]
        placeholder:
          type: ["string", "null"]
          description: Placeholder hint (localised per the `lang` parameter)
          examples: ["Example: 12345"]
        sort:
          type: integer
          description: Display order (ascending)
          examples: [0]
        min:
          type: ["number", "null"]
          description: Smallest allowed value (NUMBER) or length in characters (TEXT)
        max:
          type: ["number", "null"]
          description: Largest allowed value (NUMBER) or length in characters (TEXT)
          examples: [255]
        options:
          type: ["array", "null"]
          description: Available choices (SELECT type only)
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                examples: ["eu"]
              label:
                type: string
                examples: ["Europe"]

    ProductListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          description: |
            Present only when `per_page` query parameter was supplied.
            Omitted when all products are returned in a single response.
          $ref: "#/components/schemas/PaginationMeta"

    # ── Orders (list) ──────────────────────────────────────────────────────

    OrderSummary:
      type: object
      required: [id, amount, currency, discount, status, payment, created_at]
      properties:
        id:
          type: integer
          description: Order ID
          examples: [123]
        amount:
          type: string
          description: Total charged (after discount, 2 decimal places)
          examples: ["100.00"]
        currency:
          type: string
          enum: [TRY, EUR]
          examples: ["TRY"]
        discount:
          type: string
          description: Discount applied by coupon (2 decimal places; `"0.00"` if none)
          examples: ["0.00"]
        status:
          $ref: "#/components/schemas/OrderStatus"
        payment:
          $ref: "#/components/schemas/PaymentStatus"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp with timezone offset
          examples: ["2024-06-15T10:30:00+03:00"]
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When all items were delivered; null if not yet completed
          examples: ["2024-06-15T10:30:05+03:00"]
        cancelled_at:
          type: [string, "null"]
          format: date-time
          description: When the order was cancelled; null if not cancelled
          examples: [null]

    OrderListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Coupons ────────────────────────────────────────────────────────────

    Coupon:
      type: object
      required:
        [
          id,
          code,
          name,
          status,
          categories,
          discount_percentage,
          max_discount_amount,
          min_shopping_amount,
          currency,
          usage_count,
          max_usage_count,
          total_discount,
          expires_at,
          used_at,
          order_id,
        ]
      properties:
        id:
          type: integer
          examples: [812]
        code:
          type: string
          description: Coupon code; send it as `coupon_code` when ordering
          examples: ["K7Q2XPA"]
        name:
          type: string
          description: Coupon name in the requested language
          examples: ["Special for You"]
        status:
          type: string
          enum: [active, used, cancelled, expired, invalid]
          description: |
            - `active` — can be used now
            - `used` — spent (a multi-use coupon only once its last use is taken)
            - `cancelled` — cancelled by us
            - `expired` — past its expiry date
            - `invalid` — no longer usable for another reason
        categories:
          type: array
          items:
            type: string
          description: Where the coupon applies, as the My Coupons page names them
          examples: [["Steam"]]
        discount_percentage:
          type: [string, "null"]
          description: Percentage off the matching products (2 decimal places); null for a fixed-amount coupon, whose discount is `max_discount_amount`
          examples: ["10.00"]
        max_discount_amount:
          type: string
          description: The most the coupon takes off one order (2 decimal places)
          examples: ["25.00"]
        min_shopping_amount:
          type: string
          description: Smallest matching total the coupon applies to (2 decimal places; `"0.00"` if none)
          examples: ["100.00"]
        currency:
          type: string
          enum: [TRY, EUR]
          description: Currency of the amounts; the coupon applies to orders in this currency
          examples: ["TRY"]
        usage_count:
          type: integer
          description: Times the coupon has been used
          examples: [0]
        max_usage_count:
          type: [integer, "null"]
          description: Times it can be used; null for a single-use coupon
          examples: [null]
        total_discount:
          type: string
          description: Total discount the coupon has given so far (2 decimal places)
          examples: ["0.00"]
        expires_at:
          type: [string, "null"]
          format: date-time
          examples: ["2026-11-30T23:59:59+03:00"]
        used_at:
          type: [string, "null"]
          format: date-time
          description: When the coupon was spent; null while it can still be used
          examples: [null]
        order_id:
          type: [integer, "null"]
          description: The order a spent coupon was used on
          examples: [null]

    CouponListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Coupon"
        meta:
          allOf:
            - $ref: "#/components/schemas/PaginationMeta"
            - type: object
              required: [counts]
              properties:
                counts:
                  type: object
                  description: Number of the account's coupons in each state, whatever the `status` filter
                  required: [all, active, used, cancelled, expired, invalid]
                  properties:
                    all:
                      type: integer
                      examples: [4]
                    active:
                      type: integer
                      examples: [1]
                    used:
                      type: integer
                      examples: [1]
                    cancelled:
                      type: integer
                      examples: [1]
                    expired:
                      type: integer
                      examples: [1]
                    invalid:
                      type: integer
                      description: Cancelled, expired or run out
                      examples: [2]

    # ── Order create ───────────────────────────────────────────────────────

    CreateOrderItem:
      type: object
      required: [ref, amount]
      properties:
        ref:
          type: string
          description: Product reference string (from `GET /products`)
          examples: ["steam-50-try"]
        amount:
          type: integer
          minimum: 1
          maximum: 49
          description: Quantity to purchase. Must be `1` for top-up products.
          examples: [2]
        topup_inputs:
          type: ["object", "null"]
          description: |
            Required for top-up products (`is_topup: true`). A key-value map
            where keys match the `key` field from the product's `topup_inputs`
            definition. Ignored for standard products.
          additionalProperties:
            type: string
          examples: [{ "user_id": "123456789" }]

    CreateOrderRequest:
      type: object
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            List of products to order. Each `ref` must appear **at most once**;
            combine quantities into a single entry if you need more than one unit
            of the same product.
          items:
            $ref: "#/components/schemas/CreateOrderItem"
        coupon_code:
          type: string
          description: |
            Code of one of the account's coupons (`GET /coupons`) to use for this order. It must fit the ordered
            products, or the order fails. Omit it to have the active coupon with the largest discount applied
            automatically.
          examples: ["K7Q2XPA"]
        use_coupon:
          type: boolean
          default: true
          description: |
            `false` orders without any coupon, instead of the automatic one. Cannot be combined with `coupon_code`.

    CreateOrderData:
      type: object
      required: [order_id, amount, discount, coupon_code, currency]
      properties:
        order_id:
          type: integer
          description: ID of the newly created order
          examples: [456]
        amount:
          type: string
          description: Total amount charged after discount (2 decimal places)
          examples: ["100.00"]
        discount:
          type: string
          description: Discount applied (2 decimal places; `"0.00"` if none)
          examples: ["0.00"]
        coupon_code:
          type: [string, "null"]
          description: Code of the coupon the order used; null if none was applied
          examples: [null]
        currency:
          type: string
          enum: [TRY, EUR]
          description: Currency in which the order was charged
          examples: ["TRY"]

    CreateOrderResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          $ref: "#/components/schemas/CreateOrderData"

    # ── Order detail ───────────────────────────────────────────────────────

    OrderProduct:
      type: object
      required: [product_ref, name, amount, delivered, price, total_price]
      properties:
        product_ref:
          type: string
          description: Product reference string
          examples: ["steam-50-try"]
        name:
          type: string
          description: Product name at the time of purchase, in the language the order was placed in (`lang` parameter of the create request, or the account language)
          examples: ["Steam 50 TRY"]
        amount:
          type: integer
          description: Quantity ordered
          examples: [2]
        delivered:
          type: integer
          description: Quantity delivered so far (< `amount` means partial delivery, or units removed and refunded)
          examples: [2]
        price:
          type: string
          description: Unit price at time of purchase (2 decimal places)
          examples: ["50.00"]
        total_price:
          type: string
          description: "`price × amount` (2 decimal places)"
          examples: ["100.00"]

    DeliveryAccount:
      type: object
      required: [product_ref, username, password]
      description: Delivered credential for an account-type product
      properties:
        product_ref:
          type: string
          examples: ["netflix-1m-tr"]
        username:
          type: string
          examples: ["user@example.com"]
        password:
          type: string
          examples: ["secret123"]

    DeliveryEpin:
      type: object
      required: [product_ref, code]
      description: Delivered code for an e-pin/gift-card type product
      properties:
        product_ref:
          type: string
          examples: ["steam-50-try"]
        code:
          type: string
          description: Redemption code
          examples: ["ABCD-EFGH-IJKL-MNOP"]

    DeliveryTopup:
      type: object
      required: [product_ref, topup_values]
      description: Stored top-up input snapshot for a top-up product
      properties:
        product_ref:
          type: string
          examples: ["valorant-vp-tr-375"]
        topup_values:
          type: object
          additionalProperties:
            type: [string, number, boolean, "null"]
          examples:
            - player_id: "12345678"
              region: "tr"

    OrderDetail:
      type: object
      required:
        [
          id,
          amount,
          currency,
          discount,
          status,
          payment,
          created_at,
          products,
          deliveries,
        ]
      properties:
        id:
          type: integer
          examples: [123]
        amount:
          type: string
          description: Total charged after discount (2 decimal places)
          examples: ["100.00"]
        currency:
          type: string
          enum: [TRY, EUR]
          examples: ["TRY"]
        discount:
          type: string
          description: Coupon discount (2 decimal places; `"0.00"` if none)
          examples: ["0.00"]
        status:
          $ref: "#/components/schemas/OrderStatus"
        payment:
          $ref: "#/components/schemas/PaymentStatus"
        created_at:
          type: string
          format: date-time
          examples: ["2024-06-15T10:30:00+03:00"]
        completed_at:
          type: [string, "null"]
          format: date-time
          examples: ["2024-06-15T10:30:05+03:00"]
        cancelled_at:
          type: [string, "null"]
          format: date-time
          examples: [null]
        cancellation_reason:
          type: [string, "null"]
          description: Plain-text reason for cancellation in the account language (`tr` when it is Turkish, otherwise `en`); null if not cancelled
          examples: [null]
        products:
          type: array
          description: Line items in this order
          items:
            $ref: "#/components/schemas/OrderProduct"
        deliveries:
          type: array
          description: |
            Digital goods delivered for this order.
            Empty while status is `processing`, except for top-up entries, which echo the inputs the order
            was placed with from the start (see `products[].delivered`).
            Each item is either a credential pair (account), a single code (e-pin),
            or a stored top-up input snapshot.
          items:
            oneOf:
              - $ref: "#/components/schemas/DeliveryAccount"
              - $ref: "#/components/schemas/DeliveryEpin"
              - $ref: "#/components/schemas/DeliveryTopup"

    OrderDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          $ref: "#/components/schemas/OrderDetail"

    # ── Errors ─────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          examples: [false]
        error:
          type: string
          description: Human-readable error message
          examples: ["API key required."]
        code:
          type: string
          description: Machine-readable error code
          examples: ["UNAUTHORIZED"]

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, NOT_FOUND]
              examples: ["VALIDATION_ERROR"]

    OrderFailedError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              enum: [ORDER_FAILED]
              examples: ["ORDER_FAILED"]

    InsufficientBalanceError:
      description: |
        Extended error returned when the order fails specifically due to
        insufficient balance. Includes a `redirect` URL to the top-up page,
        the exact `balance_needed` (rounded up to the nearest integer),
        and the `currency` code.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [redirect, balance_needed, currency]
          properties:
            code:
              type: string
              enum: [ORDER_FAILED]
              examples: ["ORDER_FAILED"]
            redirect:
              type: string
              format: uri
              description: URL of the balance top-up page
              examples: ["https://www.gamermarkt.com/bakiye-yukle"]
            balance_needed:
              type: number
              description: Minimum amount that must be added to cover the order
              examples: [50]
            currency:
              type: string
              description: Currency code in lowercase
              enum: [try, eur]
              examples: ["try"]

  responses:
    Unauthorized:
      description: |
        Authentication failed. Possible reasons:
        - `X-Api-Key` header is missing
        - Key is not exactly 64 characters
        - Key does not exist in the database
        - Key has been deactivated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing_key:
              summary: Header not provided
              value:
                success: false
                error: "API key required."
                code: "UNAUTHORIZED"
            invalid_key:
              summary: Key not found or inactive
              value:
                success: false
                error: "Invalid or inactive API key."
                code: "UNAUTHORIZED"

    NotFound:
      description: |
        The requested resource does not exist, or belongs to a different user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Order not found."
            code: "NOT_FOUND"

    MethodNotAllowed:
      description: The HTTP method used is not supported for this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Method not allowed."
            code: "METHOD_NOT_ALLOWED"
